<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Data Entry Software</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f4f4f4;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#222;
}

.form-box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.button-group{
    margin-top:20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0056b3;
}

.search-box{
    flex:1;
}

.table-container{
    overflow-x:auto;
    background:white;
    padding:10px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

table th{
    background:#007bff;
    color:white;
    padding:10px;
    border:1px solid #ccc;
}

table td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

.filter-input{
    width:100%;
    padding:5px;
    border:none;
    outline:none;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>

</head>

<body>

<h1>Data Entry Software</h1>

<div class="form-box">

<div class="grid">

<input type="date" id="date">

<input type="text" id="description" placeholder="Description">

<input type="number" id="rate" placeholder="Rate">

<input type="number" id="qty" placeholder="Qty">

<input type="number" id="amount" placeholder="Amount">

<input type="text" id="company" placeholder="Company">

<input type="text" id="project" placeholder="Project">

<input type="text" id="partyName" placeholder="Party Name">

<input type="text" id="partyNumber" placeholder="Party Number">

<input type="number" id="givenPayment" placeholder="Given Payment">

<select id="status">
<option value="Clear">Clear</option>
<option value="Pending">Pending</option>
</select>

<input type="text" id="note" placeholder="Note">

</div>

<div class="button-group">

<button onclick="addData()">Save Entry</button>

<input 
type="text" 
id="searchInput" 
class="search-box"
placeholder="Search Anything">

<button onclick="searchTable()">Search</button>

</div>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Date</th>
<th>Description</th>
<th>Rate</th>
<th>Qty</th>
<th>Amount</th>
<th>Company</th>
<th>Project</th>
<th>Party Name</th>
<th>Party Number</th>
<th>Given Payment</th>
<th>Remaining Payment</th>
<th>Status</th>
<th>Note</th>

</tr>

<tr>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

<th><input class="filter-input" onkeyup="filterTable()" placeholder="Filter"></th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

const tableBody = document.getElementById("tableBody");


// AUTO TODAY DATE + LOAD DATA

window.onload = function(){

    let today = new Date().toISOString().split('T')[0];

    document.getElementById("date").value = today;

    loadEntries();

}



// SAVE ENTRY

async function addData(){

    let amount = Number(document.getElementById("amount").value) || 0;

    let givenPayment = Number(document.getElementById("givenPayment").value) || 0;

    let data = {

        date: document.getElementById("date").value,

        description: document.getElementById("description").value,

        rate: document.getElementById("rate").value,

        qty: document.getElementById("qty").value,

        amount: amount,

        company: document.getElementById("company").value,

        project: document.getElementById("project").value,

        partyName: document.getElementById("partyName").value,

        partyNumber: document.getElementById("partyNumber").value,

        givenPayment: givenPayment,

        remainingPayment: amount - givenPayment,

        status: document.getElementById("status").value,

        note: document.getElementById("note").value
    };


    await fetch("/save", {

        method: "POST",

        headers:{
            "Content-Type":"application/json"
        },

        body: JSON.stringify(data)

    });


    clearForm();

    loadEntries();

}



// LOAD DATA

async function loadEntries(){

    let response = await fetch("/entries");

    let data = await response.json();

    tableBody.innerHTML = "";


    data.forEach(entry => {

        tableBody.innerHTML += `

        <tr>

        <td>${entry.date}</td>
        <td>${entry.description}</td>
        <td>${entry.rate}</td>
        <td>${entry.qty}</td>
        <td>${entry.amount}</td>
        <td>${entry.company}</td>
        <td>${entry.project}</td>
        <td>${entry.partyName}</td>
        <td>${entry.partyNumber}</td>
        <td>${entry.givenPayment}</td>
        <td>${entry.remainingPayment}</td>
        <td>${entry.status}</td>
        <td>${entry.note}</td>

        </tr>

        `;

    });

}



// CLEAR FORM

function clearForm(){

    document.getElementById("description").value = "";

    document.getElementById("rate").value = "";

    document.getElementById("qty").value = "";

    document.getElementById("amount").value = "";

    document.getElementById("company").value = "";

    document.getElementById("project").value = "";

    document.getElementById("partyName").value = "";

    document.getElementById("partyNumber").value = "";

    document.getElementById("givenPayment").value = "";

    document.getElementById("note").value = "";

}



// SEARCH

function searchTable(){

    let input = document.getElementById("searchInput").value.toLowerCase();

    let rows = document.querySelectorAll("#tableBody tr");

    rows.forEach(row=>{

        let text = row.innerText.toLowerCase();

        if(text.includes(input)){
            row.style.display = "";
        }else{
            row.style.display = "none";
        }

    });

}



// FILTER

function filterTable(){

    let filters = document.querySelectorAll(".filter-input");

    let rows = document.querySelectorAll("#tableBody tr");

    rows.forEach(row=>{

        let cells = row.getElementsByTagName("td");

        let show = true;

        filters.forEach((filter,index)=>{

            let value = filter.value.toLowerCase();

            if(value && !cells[index].innerText.toLowerCase().includes(value)){
                show = false;
            }

        });

        row.style.display = show ? "" : "none";

    });

}



// ENTER KEY SUPPORT

document.addEventListener("keypress", function(event){

    if(event.key === "Enter"){

        let active = document.activeElement.id;

        if(active === "searchInput"){

            searchTable();

        }else{

            addData();

        }

    }

});

</script>

</body>
</html>
