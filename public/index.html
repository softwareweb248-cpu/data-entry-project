<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Entry Software</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#f4f4f4;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:20px;
  color:#333;
}

.form-box{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0px 0px 10px rgba(0,0,0,0.1);
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

input, select{
  padding:10px;
  border:1px solid #ccc;
  border-radius:5px;
  width:100%;
}

.button-group{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  background:#007bff;
  color:white;
  font-weight:bold;
}

button:hover{
  background:#0056b3;
}

.filter-box{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

.filter-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.table-container{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

table th{
  background:#007bff;
  color:white;
  padding:10px;
  border:1px solid #ccc;
}

table td{
  padding:8px;
  border:1px solid #ccc;
  text-align:center;
}

@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .filter-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>

</head>
<body>

<h1>Data Entry Software</h1>

<div class="form-box">

<div class="grid">

<input type="date" id="date">

<input type="text" id="description" placeholder="Description">

<input type="number" id="rate" placeholder="Rate">

<input type="number" id="qty" placeholder="Qty">

<input type="number" id="amount" placeholder="Amount">

<input type="text" id="company" placeholder="Company">

<input type="text" id="project" placeholder="Project">

<input type="text" id="partyName" placeholder="Party Name">

<input type="text" id="partyNumber" placeholder="Party Number">

<input type="number" id="givenPayment" placeholder="Given Payment">

<select id="status">
<option value="Clear">Clear</option>
<option value="Pending">Pending</option>
</select>

<input type="text" id="note" placeholder="Note">

</div>

<div class="button-group">

<button onclick="addData()">Save Entry</button>

<input type="text" id="searchInput" placeholder="Search Anything">

<button onclick="searchTable()">Search</button>

</div>

</div>

<div class="filter-box">

<h3 style="margin-bottom:15px;">Filter Data</h3>

<div class="filter-grid">

<input type="text" id="filterDate" placeholder="Filter Date">

<input type="text" id="filterCompany" placeholder="Filter Company">

<input type="text" id="filterProject" placeholder="Filter Project">

<input type="text" id="filterParty" placeholder="Filter Party Name">

<select id="filterStatus">
<option value="">All Status</option>
<option value="Clear">Clear</option>
<option value="Pending">Pending</option>
</select>

</div>

<div class="button-group">

<button onclick="filterTable()">Apply Filter</button>

<button onclick="resetFilter()">Reset Filter</button>

</div>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Date</th>
<th>Description</th>
<th>Rate</th>
<th>Qty</th>
<th>Amount</th>
<th>Company</th>
<th>Project</th>
<th>Party Name</th>
<th>Party Number</th>
<th>Given Payment</th>
<th>Remaining Payment</th>
<th>Status</th>
<th>Note</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

function addData(){

let date = document.getElementById("date").value;
let description = document.getElementById("description").value;
let rate = document.getElementById("rate").value;
let qty = document.getElementById("qty").value;
let amount = document.getElementById("amount").value;
let company = document.getElementById("company").value;
let project = document.getElementById("project").value;
let partyName = document.getElementById("partyName").value;
let partyNumber = document.getElementById("partyNumber").value;
let givenPayment = document.getElementById("givenPayment").value;
let status = document.getElementById("status").value;
let note = document.getElementById("note").value;

if(amount === ""){
amount = 0;
}

if(givenPayment === ""){
givenPayment = 0;
}

let remainingPayment = amount - givenPayment;

let table = document.getElementById("tableBody");

let row = `

<tr>

<td>${date}</td>
<td>${description}</td>
<td>${rate}</td>
<td>${qty}</td>
<td>${amount}</td>
<td>${company}</td>
<td>${project}</td>
<td>${partyName}</td>
<td>${partyNumber}</td>
<td>${givenPayment}</td>
<td>${remainingPayment}</td>
<td>${status}</td>
<td>${note}</td>

</tr>

`;

table.innerHTML += row;

clearForm();

}

function clearForm(){

document.getElementById("date").value = "";
document.getElementById("description").value = "";
document.getElementById("rate").value = "";
document.getElementById("qty").value = "";
document.getElementById("amount").value = "";
document.getElementById("company").value = "";
document.getElementById("project").value = "";
document.getElementById("partyName").value = "";
document.getElementById("partyNumber").value = "";
document.getElementById("givenPayment").value = "";
document.getElementById("note").value = "";

}

function searchTable(){

let input = document.getElementById("searchInput").value.toLowerCase();

let rows = document.querySelectorAll("#tableBody tr");

rows.forEach(row=>{

let text = row.innerText.toLowerCase();

if(text.includes(input)){
row.style.display = "";
}else{
row.style.display = "none";
}

});

}

function filterTable(){

let date = document.getElementById("filterDate").value.toLowerCase();
let company = document.getElementById("filterCompany").value.toLowerCase();
let project = document.getElementById("filterProject").value.toLowerCase();
let party = document.getElementById("filterParty").value.toLowerCase();
let status = document.getElementById("filterStatus").value.toLowerCase();

let rows = document.querySelectorAll("#tableBody tr");

rows.forEach(row=>{

let cells = row.getElementsByTagName("td");

let rowDate = cells[0].innerText.toLowerCase();
let rowCompany = cells[5].innerText.toLowerCase();
let rowProject = cells[6].innerText.toLowerCase();
let rowParty = cells[7].innerText.toLowerCase();
let rowStatus = cells[11].innerText.toLowerCase();

let show = true;

if(date && !rowDate.includes(date)){
show = false;
}

if(company && !rowCompany.includes(company)){
show = false;
}

if(project && !rowProject.includes(project)){
show = false;
}

if(party && !rowParty.includes(party)){
show = false;
}

if(status && !rowStatus.includes(status)){
show = false;
}

row.style.display = show ? "" : "none";

});

}

function resetFilter(){

document.getElementById("filterDate").value = "";
document.getElementById("filterCompany").value = "";
document.getElementById("filterProject").value = "";
document.getElementById("filterParty").value = "";
document.getElementById("filterStatus").value = "";

let rows = document.querySelectorAll("#tableBody tr");

rows.forEach(row=>{

row.style.display = "";

});

}

</script>

</body>
</html>
